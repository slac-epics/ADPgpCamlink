InTerminator = CR LF;
OutTerminator = CR LF;
ReplyTimeout = 2000;    # 2 seconds total
ReadTimeout = 1000;     # 1 seconds between bytes
WriteTimeout = 500;
LockTimeout = 10000;    # 10 seconds to wait for lock
ExtraInput = Ignore;

DeviceID
{
    out "ID?";
    in "%*s";
    @mismatch {in "%*s";}
}

Report
{
    out "ST?";
    in "%*s";
    @mismatch {in "%*s";}
}

GetInt
{
    out "\$1?";
    in "\$1=%d";
    @mismatch {in "%*s";}
}

SetInt
{
    out "\$1=%d";
    in "COMPLETE";
    @mismatch {in "%*s";}
}

GetString
{
    out "\$1?";
    in "\$1=%s";
    @mismatch {in "%*s";}
}

Debug
{    
    out "%s"; in "%39c";
    @mismatch {in "%*s";}
}
