InTerminator = CR LF;
OutTerminator = CR LF;
ReplyTimeout = 10000;   # 10 seconds total
ReadTimeout = 8000;     # 8 seconds between bytes
WriteTimeout = 1000;
LockTimeout = 30000;    # 30 seconds to wait for lock
ExtraInput = Ignore;

DeviceID
{
    out "ID?";
    in "%*s";
    @mismatch {in "%*s";}
}

Report
{
    out "ST?";
    in "%*s";
    @mismatch {in "%*s";}
}

GetInt
{
    out "\$1?";
    in "\$1=%d";
    @mismatch {in "%*s";}
}

SetInt
{
    out "\$1=%d";
    in "COMPLETE";
    @mismatch {in "%*s";}
}

GetString
{
    out "\$1?";
    in "\$1=%s";
    @mismatch {in "%*s";}
}

Debug
{    
    out "%s"; in "%39c";
    @mismatch {in "%*s";}
}
